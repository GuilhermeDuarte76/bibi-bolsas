<?xml version="1.0" encoding="UTF-8"?>
<svg id="logoReveal" xmlns="http://www.w3.org/2000/svg" width="3240" height="3240" viewBox="0 0 3240 3240" role="img" data-vector-quality="native-font-outlines">
  <title>Bibi Bolsas — versão 1 com bolsa laranja, lettering preto e fundo transparente</title>
  <desc>Assinatura horizontal com uma bolsa de moda em linhas orgânicas, painel lateral, dobra superior e alças completas sobrepostas.</desc>
  <style>
    :root {
      --background: #a4603f;
      --cream: #292929;
      --snap: cubic-bezier(.18, 1.24, .32, 1);
      --flow: cubic-bezier(.2, .82, .22, 1);
    }

    #logoReveal {
      overflow: hidden;
      shape-rendering: geometricPrecision;
    }

    .bag-stroke,
    .word-letter,
    .sub-letter {
      transform-box: fill-box;
      backface-visibility: hidden;
      will-change: opacity, transform, stroke-dashoffset;
    }

    .bag-stroke {
      opacity: 0;
      fill: none;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: lineDraw var(--duration, 900ms) var(--flow) var(--delay, 0ms) both;
    }

    .word-letter {
      opacity: 0;
      fill: #292929;
      transform-origin: left center;
      animation: wordExpand 560ms var(--snap) calc(1240ms + var(--letter-delay)) both;
    }

    .sub-letter {
      opacity: 0;
      fill: #292929;
      transform-origin: left center;
      animation: subtitleExpand 500ms var(--flow) calc(1940ms + var(--letter-delay)) both;
    }

    @keyframes lineDraw {
      0% { opacity: 0; stroke-dashoffset: 1; }
      8% { opacity: 1; }
      100% { opacity: 1; stroke-dashoffset: 0; }
    }

    @keyframes wordExpand {
      0% { opacity: 0; transform: translateX(-104px) scaleX(.62); }
      12% { opacity: 1; }
      70% { opacity: 1; transform: translateX(9px) scaleX(1.028); }
      100% { opacity: 1; transform: translateX(0) scaleX(1); }
    }

    @keyframes subtitleExpand {
      0% { opacity: 0; transform: translateX(-48px) scaleX(.72); }
      14% { opacity: 1; }
      74% { opacity: 1; transform: translateX(4px) scaleX(1.018); }
      100% { opacity: 1; transform: translateX(0) scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bag-stroke,
      .word-letter,
      .sub-letter {
        animation: none !important;
        opacity: 1;
        transform: none;
        stroke-dashoffset: 0;
      }
    }
  </style>

  <rect id="background" width="3240" height="3240" fill="none" />

  <g id="brand-lockup">
    <g id="fashion-line-bag" aria-label="Bolsa de moda minimalista com alças completas sobrepostas" fill="none" stroke="#a4603f" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
